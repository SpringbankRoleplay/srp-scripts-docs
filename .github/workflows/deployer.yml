name: Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Make English homepage the root homepage
        run: cp out/en/index.html out/index.html

      - name: Check homepage asset paths
        run: |
          echo "Root homepage:"
          grep -oE 'src="[^"]+|href="[^"]+' out/index.html | head -50

          echo ""
          echo "English homepage:"
          grep -oE 'src="[^"]+|href="[^"]+' out/en/index.html | head -50

      - name: List output directory contents
        run: |
          echo "Contents of out directory:"
          ls -la out/

          echo "Checking for index.html:"
          if [ -f "out/index.html" ]; then
            echo "✅ index.html found!"
            head -n 20 out/index.html
          else
            echo "❌ index.html NOT found!"
            exit 1
          fi
            - name: Upload
              uses: actions/upload-pages-artifact@v3
              with:
                path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
