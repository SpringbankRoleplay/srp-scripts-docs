name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Mirror out/en → out/
        run: |
          test -d out/en || { echo "out/en does not exist — did the export produce locale dirs?"; exit 1; }
          cp -a out/en/. out/
          echo "mirrored out/en → out/"

      - name: Verify export
        run: |
          test -f out/index.html    || { echo "root mirror missing"; exit 1; }
          test -f out/en/index.html || { echo "missing out/en/"; exit 1; }
          test -f out/nl/index.html || { echo "missing out/nl/"; exit 1; }
          test -d out/_pagefind     || { echo "pagefind failed"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4